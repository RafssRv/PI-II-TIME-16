<!--
Autor: Priscila Amorim - RA: 24787350
Tela: Projetos

Descrição: 
Estrutura HTML da tela de consulta de projetos. Organiza o cabeçalho da página, campo de pesquisa, área de exibição 
dos cartões de projetos e informações dos integrantes das equipes, além dos elementos de navegação e mensagens ao usuário
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/projetos.css">

</head>
<body>

    <!-- Menu lateral com os dados do usuário e os atalhos do sistema -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h4>DemandasApp</h4>

            <!-- Mostra a saudação e o perfil do usuário conectado -->
            <p id="saudacaoUsuario">Carregando...</p>
            <span id="perfilUsuario"></span>
        </div>

        <!-- Reúne os atalhos para as telas do sistema -->
        <nav class="sidebar-menu">

            <!-- Atalho para cadastrar uma demanda, exibido conforme o perfil -->
            <a href="cadastro.html" id="link-nova-demanda" class="link-nova">+ Nova Demanda</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="listagemDemandas.html">Demandas</a>

            <!-- Leva à página de projetos e destaca a seção atual -->
            <a href="projetos.html" class="active">Projetos</a>

            <!-- Botão que encerra a sessão do usuário -->
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </nav>
    </aside>

    <!-- Conteúdo principal da tela -->
    <main>
        <div class="container">

            <!-- Título e descrição da página -->
            <header class="page-header">
                <h1 class="page-title">Meus projetos</h1>
                <p>Projetos dos quais você participa e suas respectivas equipes.</p>
            </header>

            <!-- Identifica o campo de pesquisa de projetos -->
            <label class="busca-label" for="busca-projetos">Buscar projeto</label>

            <!-- Campo para pesquisar projetos enquanto a pessoa digita -->
            <input
                type="search"
                id="busca-projetos"
                class="campo-busca"
                placeholder="Digite o nome ou a descrição do projeto..."
            >

            <!-- Mensagem exibida enquanto os projetos são carregados -->
            <p id="projetos-carregando" class="mensagem-info" role="status">
                Carregando projetos...
            </p>

            <!-- Espaço para mostrar erros ao carregar os projetos -->
            <p id="projetos-erro" class="mensagem-erro" role="alert" hidden></p>

            <!-- Mensagem exibida quando o usuário não possui projetos vinculados -->
            <p id="projetos-vazio" class="mensagem-info" hidden>
                Você não está vinculado a nenhum projeto.
            </p>
            
            <!-- Mensagem exibida quando a pesquisa não encontra projetos -->
            <p id="projetos-sem-resultado" class="mensagem-info" hidden>
                Nenhum projeto corresponde à busca.
            </p>

            <!-- Área para mostrar os projetos e suas equipes em cartões -->
            <section id="lista-projetos" class="projetos-grid" aria-label="Projetos vinculados"></section>
        </div>
    </main>

    <!-- Carrega as funções de comunicação com o servidor -->
    <script src="../js/api.js"></script>

    <!-- Carrega os dados da sessão e o controle do menu lateral -->
    <script src="../js/sessao.js"></script>

    <!-- Carrega os projetos e controla a pesquisa da tela -->
    <script src="../js/projetos.js"></script>
</body>
</html>
