<!-- Autor: Heloisa L Marinho --> 
<!-- Descrição: Permite que todas as demandas sejam listadas 
e também com filtro de busca por critério --> 

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/listagem.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/listagem.js" defer></script>
    <title>Listagem de Demandas</title>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
    <div class="sidebar-logo">
        <h4>DemandasApp</h4>
    </div>
    <nav class="sidebar-menu">
        <a href="cadastro.html" class="sidebar-logo"><button class="btn-primary-custom">+ Nova Demanda</button></a>
        <a href="dashboard.html">Dashboard</a>
        <a href="listagemDemandas.html" class="active">Demandas</a>
        <a href="listagemDemandas.html#filtro-projeto">Projetos</a>
    </nav>
    </aside>

    <main>
        <div class="container">
            <h1 class="page-title">Visualizar Demandas</h1>

            <div class="content-card">
                <form class="toolbar-filters" id="filtros">
                    
                    <div class="form-group filter-group busca">
                        <label for="filtro-busca">Buscar por título ou descrição</label>
                        <input type="text" id="filtro-busca" class="form-control-custom" placeholder="Digite aqui...">
                    </div>
                    
                    <div class="form-group filter-group">
                        <label for="filtro-status">Filtrar por Status</label>
                        <select id="filtro-status" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="todos">Todos</option>
                            <option value="aberta">Aberta</option>
                            <option value="andamento">Em andamento</option>
                            <option value="revisao">Em revisão</option>
                            <option value="concluida">Concluída</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                    </div>

                    <div class="form-group filter-group">
                        <label for="filtro-prioridade">Filtrar por Prioridade</label>
                        <select id="filtro-prioridade" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="todos">Todas</option>
                            <option value="critica">Crítica</option>
                            <option value="alta">Alta</option>
                            <option value="media">Média</option>
                            <option value="baixa">Baixa</option>
                        </select>
                    </div>

                    <div class="form-group filter-group">
                        <label for="filtro-tipo">Tipo</label>
                        <select id="filtro-tipo" class="form-select-custom">
                            <option value="">Todos</option>
                            <option value="TAREFA">Tarefa</option>
                            <option value="DEFEITO">Defeito</option>
                            <option value="MELHORIA">Melhoria</option>
                            <option value="DOCUMENTACAO">Documentação</option>
                        </select>
                    </div>
                    <div class="form-group filter-group">
                        <label for="filtro-projeto">Projeto</label>
                        <select id="filtro-projeto" class="form-select-custom"><option value="">Todos</option></select>
                    </div>
                    <div class="form-group filter-group">
                        <label for="filtro-responsavel">Responsável</label>
                        <select id="filtro-responsavel" class="form-select-custom"><option value="">Todos</option></select>
                    </div>
                    <div class="form-group filter-group">
                        <label for="filtro-ordenacao">Ordenar por</label>
                        <select id="filtro-ordenacao" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="criacao_desc">Data de criação</option> 
                            <option value="prazo_asc">Prazo de finalização</option> 
                            <option value="prioridade_desc">Prioridade</option> 
                            <option value="status">Status</option> 
                        </select>
                    </div>

                    <div>
                        <button type="submit" id="btn-filtrar" class="btn-primary-custom btn-filtrar">Filtrar / Buscar</button>
                    </div>
                </form>
            </div>

            <div class="demandas-grid" id="demandas-grid" aria-live="polite">Carregando demandas...</div>
        </div>
    </main>
</body>
</html>
