<!-- 
Autor: Heloisa L Marinho - RA: 25893868
Tela: Listagem de Demandas

Descrição: 
Página de consulta das demandas cadastradas, com busca por título ou descrição, filtros e opções de ordenação
Os resultados aparecem em cartões com acesso à página de detalhes de cada demanda
--> 

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/listagem.css">
    <title>Listagem de Demandas</title>
</head>

<body>
    <!-- Menu lateral com a identificação do usuário e os atalhos do sistema -->
    <aside class="sidebar">

        <!-- Mostra o nome do sistema, a saudação e o perfil do usuário -->
        <div class="sidebar-logo">
            <h4>DemandasApp</h4>
            <p id="saudacaoUsuario">Carregando...</p>
            <span id="perfilUsuario"></span>
        </div>

        <!-- Reúne os links para as principais telas e a opção de sair -->
        <nav class="sidebar-menu">

            <!-- Abre a página para cadastrar uma nova demanda -->
            <a href="cadastro.html" class="sidebar-logo"><button class="btn-primary-custom">+ Nova Demanda</button></a>

            <!-- Link para o painel com o resumo das informações -->
            <a href="dashboard.html">Dashboard</a>

            <!-- Indica que a página de demandas está aberta -->
            <a href="listagemDemandas.html" class="active">Demandas</a>

            <!-- Link para consultar projetos -->
            <a href="projetos.html">Projetos</a>

            <!-- Botão usado para encerrar a sessão -->
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </nav>
    </aside>

    <!-- Área principal que contém o título, os filtros e os resultados -->
    <main>
        <div class="container">

            <!-- Título da página -->
            <h1 class="page-title">Visualizar Demandas</h1>

            <!-- Cartão que agrupa os campos de busca, filtros e ordenação -->
            <div class="content-card">

                <!-- Formulário usado para buscar, filtrar e ordenar as demandas -->
                <form class="toolbar-filters" id="filtros">

                    <!-- Campo para procurar palavras no título ou na descrição -->
                    <div class="form-group filter-group busca">

                        <!-- Identifica o campo de pesquisa -->
                        <label for="filtro-busca">Buscar por título ou descrição</label>

                        <!-- Campo para digitar o texto da pesquisa -->
                        <input type="text" id="filtro-busca" class="form-control-custom" placeholder="Digite aqui...">
                    </div>

                    <!-- Filtro para mostrar demandas de um status escolhido -->
                    <div class="form-group filter-group">
                        <label for="filtro-status">Filtrar por Status</label>

                        <!-- Lista com os status disponíveis -->
                        <select id="filtro-status" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="todos">Todos</option>
                            <option value="aberta">Aberta</option>
                            <option value="andamento">Em andamento</option>
                            <option value="revisao">Em revisão</option>
                            <option value="concluida">Concluída</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                    </div>

                    <!-- Filtro para mostrar demandas de uma prioridade escolhida -->
                    <div class="form-group filter-group">
                        <label for="filtro-prioridade">Filtrar por Prioridade</label>

                        <!-- Lista com as prioridades disponíveis -->
                        <select id="filtro-prioridade" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="todos">Todas</option>
                            <option value="critica">Crítica</option>
                            <option value="alta">Alta</option>
                            <option value="media">Média</option>
                            <option value="baixa">Baixa</option>
                        </select>
                    </div>

                    <!-- Filtro para escolher o tipo de demanda -->
                    <div class="form-group filter-group">
                        <label for="filtro-tipo">Tipo</label>

                        <!-- Lista com os tipos de demanda disponíveis -->
                        <select id="filtro-tipo" class="form-select-custom">
                            <option value="">Todos</option>
                            <option value="TAREFA">Tarefa</option>
                            <option value="DEFEITO">Defeito</option>
                            <option value="MELHORIA">Melhoria</option>
                            <option value="DOCUMENTACAO">Documentação</option>
                        </select>
                    </div>

                    <!-- Filtro para escolher um projeto -->
                    <div class="form-group filter-group">
                        <label for="filtro-projeto">Projeto</label>

                        <!-- Lista de projetos preenchida pelo JavaScript -->
                        <select id="filtro-projeto" class="form-select-custom"><option value="">Todos</option></select>
                    </div>

                    <!-- Filtro para escolher a pessoa responsável -->
                    <div class="form-group filter-group">
                        <label for="filtro-responsavel">Responsável</label>

                        <!-- Lista de responsáveis preenchida pelo JavaScript -->
                        <select id="filtro-responsavel" class="form-select-custom"><option value="">Todos</option></select>
                    </div>

                    <!-- Escolhe a ordem em que as demandas serão exibidas -->
                    <div class="form-group filter-group">
                        <label for="filtro-ordenacao">Ordenar por</label>
                        
                        <!-- Lista com as opções de ordenação -->
                        <select id="filtro-ordenacao" class="form-select-custom">
                            <option value="selecione" selected disabled>Selecione...</option>
                            <option value="criacao_desc">Data de criação</option> 
                            <option value="prazo_asc">Prazo de finalização</option> 
                            <option value="prioridade_desc">Prioridade</option> 
                            <option value="status">Status</option> 
                        </select>
                    </div>

                    <!-- Botão que aplica os filtros e a busca preenchidos -->
                    <div>
                        <button type="submit" id="btn-filtrar" class="btn-primary-custom btn-filtrar">Filtrar / Buscar</button>
                    </div>
                </form>
            </div>

            <!-- Área onde o JavaScript apresenta as demandas encontradas -->
            <div class="demandas-grid" id="demandas-grid" aria-live="polite">Carregando demandas...</div>
        </div>
    </main>

    <!-- Carrega as funções de comunicação com o servidor -->
    <script src="../js/api.js"></script>

    <!-- Carrega os dados da sessão e o controle do menu lateral -->
    <script src="../js/sessao.js"></script>

    <!-- Carrega as demandas e controla os filtros da listagem -->
    <script src="../js/listagem.js"></script>
</body>
</html>
