Descrição: 
Tela de entrada do DemandasApp, com os campos de e-mail e senha e o botão Entrar. O formulário inclui orientações
de preenchimento e espaços para apresentar mensagens de erro caso os dados estejam incompletos ou o acesso seja recusado
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DemandasApp - Login </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head> 

<body class="bg-light">

    <div class="pagina-login">

        <div class="card-login shadow-sm">

            <h1 class="logo"> DemandasApp </h1>

            <h2> Acesse sua conta </h2>

            <p class="text-secondary"> Preencha os campos abaixo para entrar no sistema. </p>

            <!-- Formulário de login; login.js verifica os dados ao enviá-lo -->
            <form id="form-login" novalidate>

                <!-- Agrupa o campo de e-mail e sua mensagem de erro -->
                <div class="campo mb-3 text-start">

                    <!-- Identifica o campo de e-mail como obrigatório -->
                    <label for="email" class="form-label"><strong>E-mail *</strong></label>

                    <!-- Campo para digitar o e-mail, com um exemplo de preenchimento -->
                    <input type="email" id="email" class="form-control" placeholder="seu.email@empresa.com" required>

                    <!-- Espaço para mostrar erros no e-mail -->
                    <div id="erro-email" class="invalid-feedback"></div>
                </div>

                <!-- Agrupa o campo de senha e sua mensagem de erro -->
                <div class="campo mb-3 text-start">

                    <!-- Identifica o campo de senha como obrigatório -->
                    <label for="senha" class="form-label"><strong>Senha *</strong></label>

                    <!-- Campo para digitar a senha, com os caracteres ocultos -->
                    <input type="password" id="senha" class="form-control" placeholder="••••••••" required>

                    <!-- Espaço para mostrar erros de senha ou de login -->
                    <div id="erro-senha" class="invalid-feedback"></div>
                </div>

                <!-- Botão que envia o formulário -->
                <button type="submit" class="btn btn-primary w-100 mt-3 botao-entrar">Entrar</button>
            </form>

        </div>

    </div>

    <!-- Carrega as funções de comunicação com o servidor -->
    <script src="../js/api.js"></script>

    <!-- Carrega as verificações e o controle de login da tela -->
    <script src="../js/login.js"></script>
</body>
</html>
