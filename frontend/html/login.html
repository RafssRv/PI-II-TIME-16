<!--
Autora: Sophia Franco de Godoy / RA: 24000833
Descrição: Estrutura e organização da tela de acesso ao DemandasApp

1. Definir o idioma, a codificação dos caracteres e a área de visualização
   de acordo com a largura do dispositivo
2. Carregar os estilos do Bootstrap e as personalizações de login.css
3. Apresentar o nome do sistema, o título da área de acesso e as orientações
   de preenchimento do formulário
4. Organizar os campos obrigatórios de e-mail e senha, associando cada campo
   ao seu respectivo rótulo de identificação
5. Reservar os espaços utilizados pelo JavaScript para exibir mensagens de erro
6. Disponibilizar o botão de entrada e carregar os scripts de comunicação
   com a API e de controle do formulário
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DemandasApp - Login </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head> 

<body class="bg-light">

    <!-- Área usada pelo CSS para centralizar o cartão de login -->
    <div class="pagina-login">

        <!-- Cartão do formulário com uma sombra leve do Bootstrap -->
        <div class="card-login shadow-sm">

            <!-- Exibe o nome do sistema -->
            <h1 class="logo"> DemandasApp </h1>

            <!-- Apresenta o título da área de acesso -->
            <h2> Acesse sua conta </h2>

            <!-- Orienta o usuário antes do preenchimento -->
            <p class="text-secondary"> Preencha os campos abaixo para entrar no sistema. </p>

            <!-- novalidate deixa a validação do envio sob o controle de login.js -->
            <form id="form-login" novalidate>

                <!-- Grupo do campo de e-mail -->
                <div class="campo mb-3 text-start">

                    <!-- Associa o nome do campo ao input de e-mail -->
                    <label for="email" class="form-label"><strong>E-mail *</strong></label>

                    <!-- Campo obrigatório com um exemplo de e-mail -->
                    <input type="email" id="email" class="form-control" placeholder="seu.email@empresa.com" required>

                    <!-- Recebe a mensagem de erro do e-mail -->
                    <div id="erro-email" class="invalid-feedback"></div>
                </div>

                <!-- Grupo do campo de senha -->
                <div class="campo mb-3 text-start">

                    <!-- Associa o nome do campo ao input de senha -->
                    <label for="senha" class="form-label"><strong>Senha *</strong></label>

                    <!-- Campo obrigatório que oculta os caracteres da senha -->
                    <input type="password" id="senha" class="form-control" placeholder="••••••••" required>

                    <!-- Recebe erros de preenchimento da senha ou da solicitação de acesso -->
                    <div id="erro-senha" class="invalid-feedback"></div>
                </div>

                <!-- Envia o formulário e ocupa toda a largura disponível -->
                <button type="submit" class="btn btn-primary w-100 mt-3 botao-entrar">Entrar</button>
            </form>

        </div>

    </div>

    <!-- Carrega a função de comunicação com o servidor -->
    <script src="../js/api.js"></script>

    <!-- Carrega a validação e o controle do login -->
    <script src="../js/login.js"></script>
</body>
</html>
