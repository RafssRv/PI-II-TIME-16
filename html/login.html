<!--
Autora: Sophia Franco de Godoy
Descrição: Estrutura da página de login do DemandasApp, contendo título, campos de e-mail e senha e botão de acesso ao sistema
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemandasApp - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="pagina-login">

        <div class="card-login">

            <h1 class="logo">DemandasApp</h1>
            <h2>Acesse sua conta</h2>
            <p>Preencha os campos abaixo para entrar no sistema.</p>

            <div class="campo">
                <p><strong>E-mail *</strong></p>
                <input type="email" class="caixa-input" placeholder="seu.email@empresa.com">
            </div>

            <div class="campo">
                <p><strong>Senha *</strong></p>
                <input type="password" class="caixa-input" placeholder="••••••••">
            </div>

            <div class="botao-entrar">
                <a href="#">Entrar</a>
            </div>

        </div>

    </div>

</body>
</html>
